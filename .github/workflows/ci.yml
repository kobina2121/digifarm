name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: digifarm
          POSTGRES_PASSWORD: digifarm
          POSTGRES_DB: digifarm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U digifarm"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://digifarm:digifarm@localhost:5432/digifarm
      DIRECT_DATABASE_URL: postgresql://digifarm:digifarm@localhost:5432/digifarm
      # Integration tests run against the throwaway CI database.
      TEST_DATABASE_URL: postgresql://digifarm:digifarm@localhost:5432/digifarm
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-000000
      BETTER_AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      EMAIL_FROM: "DigiFarm <no-reply@digifarm.local>"
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
